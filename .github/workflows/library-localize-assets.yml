# Copies hotlinked images into the repo (public/library-assets) and rewrites references.
# Triggered by editing .library/localize.json on the branch you want localised.
name: Library - localise assets

on:
  push:
    paths:
      - ".library/localize.json"

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download and rewrite assets
        run: node .library/localize-assets.mjs
      - name: Commit results
        run: |
          git config user.name "manestream-library-bot"
          git config user.email "library-bot@users.noreply.github.com"
          git add -A public/library-assets src index.html .library/localize-report.json
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "Library: self-host hotlinked assets"
          git push
